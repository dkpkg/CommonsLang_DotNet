on:
  push:
    tags:
      - '0.1.*'
  workflow_dispatch:

jobs:
  distribute:
    environment: dk-distribution

    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            distscript: dist/any.u
            image: quay.io/pypa/manylinux_2_28_x86_64:2026.04.08-5
            target-abi: Linux_x86_64
          - runs-on: macos-latest
            distscript: dist/any.u
            execution-abi: Darwin_arm64
            target-abi: Darwin_arm64
          - runs-on: macos-latest
            distscript: dist/any.u
            execution-abi: Darwin_arm64
            target-abi: Darwin_x86_64
          - runs-on: windows-latest
            distscript: dist/any.u
            target-abi: Windows_x86
          - runs-on: windows-latest
            distscript: dist/any.u
            target-abi: Windows_x86_64
          - runs-on: windows-latest
            distscript: dist/any.u
            target-abi: Windows_arm64

    runs-on: ${{ matrix.runs-on }}
    container:
      image: ${{ matrix.image }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176
        with: { egress-policy: audit }
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Distribute Modules
        uses: diskuv/dk-distribute@v3
        with:
          pubkey: ${{ secrets.distribute_0_1_pubkey }}
          seckey: ${{ secrets.distribute_0_1_seckey }}
          options: -nosysinc
          # The .NET SDK zip hits the default Windows 260-character MAX_PATH limit in CI.
          short-build-dir: ${{ runner.os == 'Windows' && 'C:\b' || '' }}
          store: release
          distscript: ${{ matrix.distscript }}
          execution-abi: ${{ matrix.execution-abi }}
          target-abi: ${{ matrix.target-abi }}
          experimental-mlfront-ref: ${{ github.ref_type != 'tag' && 'HEAD' }}

  combine:
    needs: distribute
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176
        with: { egress-policy: audit }
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Combine Modules
        uses: diskuv/dk-distribute/combine@v3

      - name: Attest
        id: attest
        uses: actions/attest-build-provenance@v3
        with: { subject-path: dk-dist/* }

      - name: Release ${{ github.job }}
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe
        with: { files: dk-dist/*, body_path: ".dist-CHANGELOG.txt" }
